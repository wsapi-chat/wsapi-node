name: Bug Report
description: Report a bug in the WSApi Node.js SDK
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Create a client with ...
        2. Call method ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK Version
      description: The version of @wsapichat/client you are using.
      placeholder: e.g., 1.0.10
    validations:
      required: true

  - type: dropdown
    id: node-version
    attributes:
      label: Node.js Version
      options:
        - '18'
        - '20'
        - '22'
        - Other
    validations:
      required: true

  - type: dropdown
    id: integration-type
    attributes:
      label: Integration Type
      options:
        - SSE (Server-Sent Events)
        - Webhooks
        - API only (no events)
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
